services:
  # ── NestJS API ────────────────────────────────────────────────────────────
  - type: web
    name: smartbook-api
    runtime: node
    plan: free
    buildCommand: >
      npm ci &&
      npx prisma generate --schema=apps/api/prisma/schema.prisma &&
      npm run build --workspace=apps/api
    preDeployCommand: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
    startCommand: node apps/api/dist/main
    healthCheckPath: /api/about
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smartbook-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false          # set manually to your Render web URL after first deploy
      - key: PORT
        value: 10000         # Render default port
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  - type: web
    name: smartbook-web
    runtime: node
    plan: free
    buildCommand: >
      npm ci &&
      npm run build --workspace=apps/web
    startCommand: npm run start --workspace=apps/web
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false          # set manually to your Render API URL after first deploy

# ── Postgres Database ─────────────────────────────────────────────────────
databases:
  - name: smartbook-db
    databaseName: smartbook
    user: smartbook
    plan: free
